    <script>
      try {
        document.documentElement.classList.add('aq-root')
        document.documentElement.classList.toggle('theme-light', localStorage.getItem('aq-theme') === 'light')
        document.documentElement.classList.toggle('theme-dark', localStorage.getItem('aq-theme') !== 'light')
      } catch (e) {
        document.documentElement.classList.add('theme-dark')
      }
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      #boot-loader.page-loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020814;
      }
      #boot-loader.page-loader.is-off { display: none !important; }
      html.theme-light #boot-loader.page-loader {
        background: linear-gradient(180deg, #f7f3ea 0%, #eef1ee 48%, #e4ebe8 100%);
      }
      #boot-loader .page-loader-mark {
        width: 11.5rem;
        height: 11.5rem;
        border-radius: 1.6rem;
        background: #141820;
        overflow: hidden;
        box-shadow: 0 0 42px rgba(249, 115, 22, 0.38);
      }
      html.theme-light #boot-loader .page-loader-mark { background: #fff; }
      #boot-loader .page-loader-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #boot-loader .page-loader-name {
        margin-top: 1.15rem;
        color: #fb923c;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 700;
        font-family: Inter, sans-serif;
      }
      html.theme-light #boot-loader .page-loader-name { color: #c2410c; }
    </style>
